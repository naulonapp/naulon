name: Release (npm)

# Publishes the publisher-facing @naulon/* packages to npm on a version tag.
# Ordered by the real dependency graph — sdk (clean base) → shared (imports sdk)
# → enforce (imports shared) → wayfarer (imports shared) → wayfarer-mcp (imports
# shared + wayfarer). @naulon/tollgate is NOT published here: the gate ships as a
# Docker image (see the OSS distribution decision), not npm.
#
# Every publish is IDEMPOTENT: a version already on the registry is skipped, so a
# tag can ship only the packages whose version actually changed without failing on
# the ones already published (e.g. re-tagging when only wayfarer-mcp bumped).
#
# Trigger: push a tag like `v0.2.0`, or run manually (workflow_dispatch).
# Auth: repo secret NPM_TOKEN (an npm automation token with publish rights on the
# @naulon scope). setup-node wires it into ~/.npmrc via NODE_AUTH_TOKEN — the token
# is never echoed. Provenance is on (public repo → verifiable supply-chain link).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release + attach tarballs
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the version guard below reads the PREVIOUS tag's plugin
      # header. A shallow clone carries neither the tags nor the history to do it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Runs BEFORE the npm publish on purpose: that publish is irreversible, and a
      # guard that fires after it has already let the bad release out.
      #
      # Scope note: whether the plugin's THREE internal version sites agree (the
      # `Version:` header, NAULON_VERSION, readme.txt's `Stable tag:`) and whether the
      # changelog documents the shipping version is owned by
      # plugins/naulon/tests/unit/VersionTest.php — one owner, asserted in CI. Do not
      # restate it here; two copies of a rule means one is already wrong.
      #
      # This step asks the one question no unit test can, because it needs git history:
      # did the version MOVE relative to what was last released? v0.2.2 is the only tag
      # that has ever carried the plugin and it shipped labelled 0.1.0, so WordPress
      # offered no installed site the update. Coupling the plugin version to the TAG is
      # deliberately not the rule — only "it moved" is.
      #
      # This block used to end by saying the npm packages version themselves, and used
      # that as the reason not to check them. They did not. Between 2026-07-10 and
      # 2026-08-05, four packages took 8 months of changes — including two security
      # fixes — while their versions stood still, so three tags published nothing and
      # `npm install` served none of it. The idempotent publish below is what made it
      # silent: an unchanged version is skipped, which is indistinguishable from a
      # successful release in the log. The step after this one is that missing check.
      - name: Plugin version moved with the plugin
        run: |
          set -euo pipefail
          read_version() { sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' | head -1 | tr -d '[:space:]'; }
          hdr=$(read_version < plugins/naulon/naulon.php)
          test -n "$hdr" || { echo "::error::no Version: header in plugins/naulon/naulon.php"; exit 1; }
          echo "plugin version: $hdr"

          # Only a tag build has a previous release to compare against.
          case "${GITHUB_REF:-}" in
            refs/tags/*) ;;
            *) echo "not a tag build — drift check does not apply"; exit 0 ;;
          esac

          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -z "$prev" ]; then
            echo "no previous tag — first release, nothing to compare"
            exit 0
          fi
          echo "previous tag: $prev"

          if git diff --quiet "$prev" "${GITHUB_REF_NAME}" -- plugins/naulon/; then
            echo "plugins/naulon/ unchanged since $prev — the version may legitimately stand still"
            exit 0
          fi

          # The plugin is younger than the tag series — it did not exist at v0.2.1.
          # A tag from before it landed has nothing to compare, and must not be read
          # as drift (git show would simply die there).
          if ! git cat-file -e "$prev:plugins/naulon/naulon.php" 2>/dev/null; then
            echo "the plugin did not exist at $prev — first release to carry it"
            exit 0
          fi

          prev_hdr=$(git show "$prev:plugins/naulon/naulon.php" | read_version)
          if [ "$hdr" = "$prev_hdr" ]; then
            echo "::error::plugins/naulon/ changed since $prev but Version: is still $hdr — WordPress offers no update, so no installed site gets the fix. Bump naulon.php Version: and readme.txt Stable tag: together."
            exit 1
          fi
          echo "plugin changed since $prev and the version moved: $prev_hdr → $hdr"

      # The same question, asked of each published package: did it change since the last
      # release without its version moving? If so the idempotent publish below will skip
      # it and say "already published" — a green run that ships nothing.
      #
      # Test files are excluded from the comparison because they are excluded from the
      # build (`exclude: ["src/**/*.test.ts"]` in each package tsconfig) and the tarball
      # ships `dist` only. A test-only change genuinely alters nothing a consumer can
      # install, and a guard that demands a bump for it teaches people to bump for
      # nothing — which is how a guard stops being read.
      #
      # Whether the internal `@naulon/*` ranges still resolve after a bump is NOT asked
      # here: packages/shared/src/releaseRanges.test.ts owns that and runs on every PR,
      # which is earlier and cheaper than tag time. One owner per rule.
      - name: npm package versions moved with their packages
        run: |
          set -euo pipefail

          case "${GITHUB_REF:-}" in
            refs/tags/*) ;;
            *) echo "not a tag build — drift check does not apply"; exit 0 ;;
          esac

          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -z "$prev" ]; then
            echo "no previous tag — first release, nothing to compare"
            exit 0
          fi
          echo "previous tag: $prev"

          version_at() { git show "$1:packages/$2/package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version"; }
          failed=0

          for pkg in sdk shared enforce wayfarer wayfarer-mcp; do
            now=$(node -p "require('./packages/${pkg}/package.json').version")

            # A package that did not exist at the previous tag has nothing to compare.
            if ! git cat-file -e "$prev:packages/${pkg}/package.json" 2>/dev/null; then
              echo "→ ${pkg}: new since $prev (${now})"
              continue
            fi

            if git diff --quiet "$prev" "${GITHUB_REF_NAME}" -- "packages/${pkg}" ":(exclude)packages/${pkg}/**/*.test.ts"; then
              echo "→ ${pkg}: unchanged since $prev (${now})"
              continue
            fi

            was=$(version_at "$prev" "$pkg")
            if [ "$now" = "$was" ]; then
              echo "::error::packages/${pkg} changed since ${prev} but @naulon/${pkg} is still ${now} — the publish below will skip it as already published, so nobody can install the change. Bump packages/${pkg}/package.json (and any internal range pointing at it)."
              failed=1
            else
              echo "→ ${pkg}: changed and the version moved: ${was} → ${now}"
            fi
          done

          exit "$failed"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      # Build in dependency order so each package's dist/ resolves the one below it.
      # (prepublishOnly rebuilds too, but building up front fails fast on a bad tree.)
      - name: Build sdk → shared → enforce → wayfarer → wayfarer-mcp
        run: |
          npm run build -w @naulon/sdk
          npm run build -w @naulon/shared
          npm run build -w @naulon/enforce
          npm run build -w @naulon/wayfarer
          npm run build -w @naulon/wayfarer-mcp

      # Idempotent publish, in dependency order. --access public is required for a
      # first-time scoped publish. Each package's prepublishOnly re-runs its build
      # (harmless). A version already on the registry is skipped, not re-published —
      # so the run never fails on an unchanged package.
      - name: Publish changed @naulon packages
        run: |
          set -euo pipefail
          publish() {
            local pkg="$1"
            local ver
            ver=$(node -p "require('./packages/${pkg}/package.json').version")
            local name
            name=$(node -p "require('./packages/${pkg}/package.json').name")
            if npm view "${name}@${ver}" version >/dev/null 2>&1; then
              echo "→ ${name}@${ver} already published, skipping"
            else
              echo "→ publishing ${name}@${ver}"
              npm publish -w "${name}" --access public --provenance
            fi
          }
          publish sdk
          publish shared
          publish enforce
          publish wayfarer
          publish wayfarer-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Second home for the exact build artifacts: a GitHub Release with the
      # published .tgz attached (identical to what npm serves). npm stays the
      # canonical install source; this is a no-auth download mirror + changelog.
      - name: Pack the published tarballs
        run: |
          mkdir -p _release
          npm pack -w @naulon/sdk         --pack-destination _release
          npm pack -w @naulon/shared      --pack-destination _release
          npm pack -w @naulon/enforce     --pack-destination _release
          npm pack -w @naulon/wayfarer    --pack-destination _release
          npm pack -w @naulon/wayfarer-mcp --pack-destination _release

      # The WordPress plugin's ONLY distribution channel until it is listed on
      # wordpress.org. The portal's domains card and the customer docs both link
      # `releases/latest/download/naulon.zip` — GitHub's version-free redirector —
      # so the asset name is load-bearing: it must never gain a version suffix, and
      # in exchange nothing on the consuming side needs bumping per release.
      #
      # Zipped from a staging dir so the archive has exactly one top-level folder,
      # `naulon/`. WordPress installs a zip by unpacking it into wp-content/plugins/,
      # so a wrong root silently produces a plugin WordPress cannot see.
      #
      # What to leave out is NOT restated here — `plugins/naulon/.distignore` already
      # owns that list (it is the wordpress.org convention, and the SVN publish will
      # read the same file). rsync skips its comments and blank lines, and the leading
      # `/` entries anchor to the transfer root exactly as .distignore means them. Two
      # copies of "what never ships" would drift the first time either changed.
      - name: Pack the WordPress plugin
        run: |
          set -euo pipefail
          mkdir -p _release _wp/naulon
          rsync -a --exclude-from=plugins/naulon/.distignore plugins/naulon/ _wp/naulon/
          test -f _wp/naulon/naulon.php # the plugin header WordPress reads; no header, no plugin
          (cd _wp && zip -qr ../_release/naulon.zip naulon)
          unzip -l _release/naulon.zip | tail -3

      # What makes the zip above reachable WITHOUT anyone downloading it by hand. The plugin is
      # not on wordpress.org, so nothing publishes its version for it — this is that publisher,
      # and `includes/class-naulon-updater.php` is the reader. It is derived entirely from the
      # plugin's own headers and readme, so the version a site is OFFERED cannot drift from the
      # version in the zip attached beside it, and it rides the same version-free redirector, so
      # no URL anywhere is bumped per release.
      #
      # Both checks run in ci.yml on every push; here they are the last gate before the artifact
      # is attached, because the failure they catch is invisible from the outside — the plugin
      # rejects a manifest it distrusts, and a rejected manifest looks exactly like "you are up
      # to date" on every install.
      # Explicit rather than leaning on whatever PHP the runner image happens to ship: the
      # contract check below is a release gate, and a gate that depends on an unpinned toolchain
      # is a gate that can vanish in an image update without anyone touching this file.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: none

      - name: Pack the WordPress update manifest
        run: |
          set -euo pipefail
          node scripts/wp-update-manifest.mjs --check
          node scripts/wp-update-manifest.mjs --out=_release/naulon-update.json
          php plugins/naulon/tests/manifest-contract.php _release/naulon-update.json

      - name: GitHub Release (attach tarballs + the plugin zip + the update manifest)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            _release/*.tgz
            _release/naulon.zip
            _release/naulon-update.json
          generate_release_notes: true
