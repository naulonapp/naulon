name: Release (npm)

# Publishes the publisher-facing @naulon/* packages to npm on a version tag.
# Ordered by the real dependency graph — sdk (clean base) → shared (imports sdk)
# → enforce (imports shared) → extract (no internal imports) → wayfarer (imports
# shared + extract) → wayfarer-mcp (imports shared + wayfarer). The order lives in
# PUBLISHED_PACKAGES below, and packageMetadata.test.ts holds it to the manifests. @naulon/tollgate is NOT published here: the gate ships as a
# Docker image (see the OSS distribution decision), not npm.
#
# Every publish is IDEMPOTENT: a version already on the registry is skipped, so a
# tag can ship only the packages whose version actually changed without failing on
# the ones already published (e.g. re-tagging when only wayfarer-mcp bumped).
#
# Trigger: push a tag like `v0.2.0`, or run manually (workflow_dispatch).
# Auth: npm trusted publishing. Each published package names this repo and this
# workflow file as its trusted publisher on npmjs.com, and `npm publish` trades the
# job's OIDC token (id-token: write) for a short-lived publish credential, so there is
# no long-lived token to store or expire. Provenance is on (public repo, verifiable
# supply-chain link).

on:
  push:
    # `python-v*` ships the Python package (job `pypi` below) and nothing else; `v*` ships the rest.
    tags: ["v*", "python-v*"]
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release + attach tarballs
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      # The published packages, in dependency order: each one's dependencies come before it. The
      # build, the version check, the publish and the pack all read THIS list. Four hand-kept copies
      # is how @naulon/extract was left out of every one of them while wayfarer depended on it.
      PUBLISHED_PACKAGES: "sdk shared enforce extract wayfarer wayfarer-mcp"
    steps:
      # fetch-depth: 0 — the version guard below reads the PREVIOUS tag's plugin
      # header. A shallow clone carries neither the tags nor the history to do it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Runs BEFORE the npm publish on purpose: that publish is irreversible, and a guard that
      # fires after it has already let the bad release out.
      #
      # scripts/release.mjs owns every rule a tag must pass, for both series, and its tests are
      # scripts/release.test.mjs: each unit that changed since the previous tag OF THIS SERIES
      # moved its version (npm packages minus test files, the plugin minus .distignore), and
      # CHANGELOG.md has a section for the tag. The idempotent publish below skips an unchanged
      # version and reports success, so without this a tag can ship nothing and look green.
      #
      # Whether the plugin's three internal version sites agree is owned by
      # plugins/naulon/tests/unit/VersionTest.php, not here.
      - name: Every changed unit moved its version, and the tag has a CHANGELOG section
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release.mjs check "${GITHUB_REF_NAME}" --github

      # The update manifest this once validated was retired with the self-updater: a plugin hosted
      # on wordpress.org may not serve its own updates, so scripts/wp-update-manifest.mjs is gone
      # and this step called a file that no longer exists — every tag died here, before publish.
      # The one property worth keeping was the readme's Upgrade Notice for the shipping version,
      # and VersionTest asserts it now, on every push rather than only at a tag.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Use an npm that can publish over OIDC
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Install dependencies
        run: npm ci

      # Build in dependency order so each package's dist/ resolves the one below it.
      # (prepublishOnly rebuilds too, but building up front fails fast on a bad tree.)
      - name: Build the published packages in dependency order
        run: |
          for pkg in $PUBLISHED_PACKAGES; do npm run build -w "@naulon/${pkg}"; done

      # Idempotent publish, in dependency order. --access public is required for a
      # first-time scoped publish. Each package's prepublishOnly re-runs its build
      # (harmless). A version already on the registry is skipped, not re-published —
      # so the run never fails on an unchanged package.
      # Publishing in dependency order is necessary and NOT sufficient. `npm publish` returns
      # when the registry ACCEPTS the write, and the read path can lag that by minutes. On
      # v0.8.6 sdk@0.5.0 was published first and became resolvable last, so for several minutes
      # `npm install @naulon/shared@0.5.0` died with ETARGET on its own dependency — a package
      # we had just shipped, broken for anyone who installed it in that window, with every step
      # of this job green. So each package must be VISIBLE before the one that depends on it
      # goes out.
      - name: Publish changed @naulon packages
        run: |
          set -euo pipefail

          # Is this exact version in the PACKUMENT, the document `npm install` resolves from?
          # Deliberately not `npm view`: that reads through npm's own cache, which the
          # pre-publish existence check below has just populated with a 404 for this version.
          registry_has() {
            local name="$1" ver="$2"
            curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
              "https://registry.npmjs.org/${name/\//%2F}" 2>/dev/null \
              | node -e '
                let s = "";
                process.stdin.on("data", d => s += d);
                process.stdin.on("end", () => {
                  try { process.exit(JSON.parse(s).versions?.[process.argv[1]] ? 0 : 1); }
                  catch { process.exit(1); }
                });
              ' "$ver"
          }

          # A publish is not done until the registry serves it. Five minutes is far past anything
          # observed (v0.8.6 took about five), and timing out is the right answer: shipping the
          # dependents anyway is what produced the broken window in the first place.
          await_registry() {
            local name="$1" ver="$2" waited=0
            until registry_has "$name" "$ver"; do
              if [ "$waited" -ge 300 ]; then
                echo "::error::${name}@${ver} was accepted by npm but is still not resolvable after ${waited}s. Anything published after it would depend on a version nobody can install. Re-run this job once the registry catches up; the publish below is idempotent and will skip what already landed."
                return 1
              fi
              sleep 10
              waited=$((waited + 10))
            done
            echo "   ${name}@${ver} is resolvable after ${waited}s"
          }

          publish() {
            local pkg="$1"
            local ver
            ver=$(node -p "require('./packages/${pkg}/package.json').version")
            local name
            name=$(node -p "require('./packages/${pkg}/package.json').name")
            if npm view "${name}@${ver}" version >/dev/null 2>&1; then
              echo "→ ${name}@${ver} already published, skipping"
              return
            fi
            echo "→ publishing ${name}@${ver}"
            npm publish -w "${name}" --access public --provenance
            await_registry "$name" "$ver"
          }
          # Dependency order matters: a package published before one it depends on would name a
          # version nobody can install yet.
          for pkg in $PUBLISHED_PACKAGES; do publish "$pkg"; done

      # Second home for the exact build artifacts: a GitHub Release with the
      # published .tgz attached (identical to what npm serves). npm stays the
      # canonical install source; this is a no-auth download mirror + changelog.
      - name: Pack the published tarballs
        run: |
          mkdir -p _release
          for pkg in $PUBLISHED_PACKAGES; do npm pack -w "@naulon/${pkg}" --pack-destination _release; done

      # The one build of the WordPress plugin. It is attached to the GitHub Release
      # for manual installs, and the wordpress-org job below commits this same zip to
      # the Plugin Directory, so both channels serve identical bytes. The README links
      # `releases/latest/download/naulon.zip`, GitHub's version-free redirector, so
      # the asset name is load-bearing: it must never gain a version suffix.
      #
      # Zipped from a staging dir so the archive has exactly one top-level folder,
      # `naulon/`. WordPress installs a zip by unpacking it into wp-content/plugins/,
      # so a wrong root silently produces a plugin WordPress cannot see.
      #
      # What to leave out is NOT restated here — `plugins/naulon/.distignore` already
      # owns that list (it is the wordpress.org convention). rsync skips its comments
      # and blank lines, and the leading `/` entries anchor to the transfer root
      # exactly as .distignore means them. Two copies of "what never ships" would
      # drift the first time either changed.
      - name: Pack the WordPress plugin
        run: |
          set -euo pipefail
          mkdir -p _release _wp/naulon
          rsync -a --exclude-from=plugins/naulon/.distignore plugins/naulon/ _wp/naulon/
          test -f _wp/naulon/naulon.php # the plugin header WordPress reads; no header, no plugin
          (cd _wp && zip -qr ../_release/naulon.zip naulon)
          unzip -l _release/naulon.zip | tail -3

      - name: GitHub Release (attach tarballs + the plugin zip)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            _release/*.tgz
            _release/naulon.zip
          generate_release_notes: true

      - name: Hand the plugin zip to the wordpress-org job
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: naulon-zip
          path: _release/naulon.zip
          if-no-files-found: error
          retention-days: 7

  # After the GitHub Release, so the directory never carries a version the Release lacks. A tag
  # whose plugin version is already in SVN is a no-op there: most tags ship npm packages only.
  wordpress-org:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/wordpress-org.yml
    with:
      mode: release
    # A called workflow sees an environment's secrets only when the caller passes them; unpassed,
    # they resolve to empty strings and nothing errors. Passed by name, so no other secret travels.
    secrets:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
    permissions:
      contents: read

  # The Python package, on a `python-v*` tag only. PyPI trusted publishing: the `naulon` project
  # names this repo, this workflow file and the `pypi` environment as its publisher, and the
  # environment only admits `python-v*` tags, so no other job can reach the PyPI token exchange.
  pypi:
    if: startsWith(github.ref, 'refs/tags/python-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/python
    steps:
      # Full history: the guard compares this tag with the previous python-v* tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Same owner as the v* guard: the tag matches pyproject.toml and naulon.__version__, the
      # package moved since the previous python-v* tag, and CHANGELOG.md has the tag's section.
      - name: The tag names the version being built, and CHANGELOG.md has its section
        working-directory: ${{ github.workspace }}
        run: node scripts/release.mjs check "${GITHUB_REF_NAME}" --github

      - name: Test before publishing
        run: |
          pip install -e '.[dev,botauth]'
          pytest -q
          mypy src
          ruff check src tests

      - name: Build
        run: |
          pip install build
          python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
