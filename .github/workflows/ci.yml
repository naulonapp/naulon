name: CI

# Typecheck + test on every push to main and every PR. Runs the same `make`
# targets contributors run locally; no build step (everything runs from TS via tsx).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history: the registry check below walks back from HEAD to each series' last tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: make lint

      - name: Test (incl. license interop conformance)
        run: make test

      # Warning only, never a red build: unreleased work is the normal state of a branch. The tag
      # guard in release.yml is what blocks; this says a release is owed, for each series
      # (npm and the plugin on v*, the Python package on python-v*), against its own last tag.
      - name: Is a registry behind this branch?
        if: github.ref == 'refs/heads/main'
        run: node scripts/release.mjs status --github

  # The Python package. 3.10 is the floor it promises; 3.13 is what Bear and most hosts run.
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # tests/test_connect_e2e.py drives the real TypeScript gate, so the workspace is installed too.
      # Without it that file skips, and the two languages are never checked against each other.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - run: pip install -e '.[dev,botauth]'
      - run: pytest -q
      - run: mypy src
      - run: ruff check src tests

  # Every migration, in order, on an empty Supabase Postgres, then all of them again. DEPLOY.md has
  # people paste them into the SQL editor or run `supabase db push`, and nothing else ever applied
  # them to a fresh database: 0004 compared a uuid column to a text one and failed there, and since
  # `db push` stops at the first failure, every migration after it was unreachable.
  migrations:
    runs-on: ubuntu-latest
    services:
      db:
        image: supabase/postgres:17.6.1.134
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply every migration to an empty database, twice
        run: |
          for pass in 1 2; do
            for f in $(ls supabase/migrations/*.sql | sort); do
              echo "pass $pass: $f"
              psql -v ON_ERROR_STOP=1 -q -f "$f"
            done
          done

  # The WordPress plugin is PHP, so the Node job above cannot see it. Until this job
  # existed, plugins/naulon/tests/ ran NOWHERE — including VersionTest, written
  # precisely to stop a build shipping under a version already in the wild, which is
  # the failure that let v0.2.2 go out labelled 0.1.0. A guard nothing executes is not
  # a guard. The suite needs no WordPress and finishes in about a tenth of a second.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The dev tree (phpunit 9 and its dependencies) cannot install below PHP 8 —
      # doctrine/instantiator in the lock requires ^8.4 — so the suite runs on current
      # PHP, and the floor the plugin advertises is covered by the syntax pass below.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer

      - name: Install dependencies
        working-directory: plugins/naulon
        run: composer install --no-interaction --no-progress

      - name: Test (unit — no WordPress needed)
        working-directory: plugins/naulon
        run: composer test

      # What reaches wordpress.org is decided by bin/wporg-svn.sh, and a release cannot be taken
      # back once a site has installed it. Its test runs every branch against a local repository.
      - name: Test the directory publish (local SVN)
        working-directory: plugins/naulon
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq subversion
          tests/wporg-svn.test.sh

      # `Requires PHP: 7.4` is a promise to publishers on older hosting, and nothing
      # checked it. php -l needs no vendor tree, so the floor can be honoured even
      # though the test tooling cannot run there.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          tools: none

      - name: Syntax-check against the declared PHP floor (7.4)
        working-directory: plugins/naulon
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

  # The suite above is the unit one: decision functions, no WordPress. Everything that only means
  # something against a real database lived in tests/integration and ran nowhere but a laptop, by
  # hand, through wp-env. One of those tests is load-bearing enough that leaving it there was a
  # standing risk:
  #
  #   UninstallDataTest — deleting the plugin keeps the publisher's wallets and earnings. A
  #                       regression silently destroys customer data, which is the exact failure
  #                       0.4.0 shipped to end.
  #
  # Real WordPress and a real MySQL, not wp-env: the images wp-env pulls cost more than the whole
  # run, and bin/install-wp-tests.sh gives contributors the same environment locally.
  plugin-integration:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer

      - name: Install dependencies
        working-directory: plugins/naulon
        run: composer install --no-interaction --no-progress

      - name: Install WordPress and the PHPUnit test library
        working-directory: plugins/naulon
        env:
          SKIP_DB_CREATE: "1" # the service container already made it
        run: bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306

      - name: Test (integration — real WordPress, real database)
        working-directory: plugins/naulon
        env:
          WP_TESTS_DIR: /tmp/naulon-wordpress-tests-lib
        run: composer run test:integration
