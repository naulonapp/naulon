name: CI

# Typecheck + test on every push to main and every PR. Runs the same `make`
# targets contributors run locally; no build step (everything runs from TS via tsx).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: make lint

      - name: Test (incl. license interop conformance)
        run: make test

      # WARNING ONLY — never a red build. Says whether the registry is behind this branch.
      #
      # release.yml already refuses a tag whose packages changed without a version bump, which is
      # the right place to BLOCK. What nothing said, until a human went looking on 2026-08-28, is
      # that the changes exist at all: `@naulon/enforce` had carried a pricing correction for four
      # days while npm still served the version before it, and the only way to learn that was to
      # diff the tree against the last tag by hand. A guard that fires at tag time cannot tell you
      # a tag is owed.
      #
      # Deliberately not a failure: unreleased work is the normal state of a branch. The signal is
      # for the person deciding whether it is time to cut one.
      - name: Is npm behind this branch?
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git fetch --tags --quiet || true
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$prev" ]; then echo "no tag yet — nothing to compare"; exit 0; fi

          behind=""
          for pkg in sdk shared enforce wayfarer wayfarer-mcp; do
            # Test files never ship (each package builds with them excluded), so a test-only
            # change is not a reason to release — same exclusion release.yml uses.
            if git diff --quiet "$prev" HEAD -- "packages/${pkg}" ":(exclude)packages/${pkg}/src/**/*.test.ts"; then
              continue
            fi
            behind="${behind} ${pkg}"
          done

          if [ -z "$behind" ]; then
            echo "npm is current with ${prev} — every published package is unchanged since the tag."
            exit 0
          fi
          echo "::warning title=npm is behind ${prev}::Published packages changed since ${prev} and are not on the registry:${behind}. Cut a release when the change is worth installing — bump each one, add its CHANGELOG.md section, then tag."

  # The WordPress plugin is PHP, so the Node job above cannot see it. Until this job
  # existed, plugins/naulon/tests/ ran NOWHERE — including VersionTest, written
  # precisely to stop a build shipping under a version already in the wild, which is
  # the failure that let v0.2.2 go out labelled 0.1.0. A guard nothing executes is not
  # a guard. The suite needs no WordPress and finishes in about a tenth of a second.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The dev tree (phpunit 9 and its dependencies) cannot install below PHP 8 —
      # doctrine/instantiator in the lock requires ^8.4 — so the suite runs on current
      # PHP, and the floor the plugin advertises is covered by the syntax pass below.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer

      - name: Install dependencies
        working-directory: plugins/naulon
        run: composer install --no-interaction --no-progress

      - name: Test (unit — no WordPress needed)
        working-directory: plugins/naulon
        run: composer test

      # The update manifest is written in JavaScript and read in PHP, and each side's own tests
      # can pass while the two disagree about a field — which reads as "no update available" on
      # every install, silently. So the real generator's output is fed to the real validator here,
      # on every push, rather than being discovered at a tag. No fixture: a committed sample of a
      # generated document would be the second source of truth this feature exists to remove.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update manifest is well-formed
        run: node scripts/wp-update-manifest.mjs --check

      - name: The plugin accepts the manifest CI would publish
        run: |
          node scripts/wp-update-manifest.mjs --out=manifest.json
          php plugins/naulon/tests/manifest-contract.php manifest.json

      # `Requires PHP: 7.4` is a promise to publishers on older hosting, and nothing
      # checked it. php -l needs no vendor tree, so the floor can be honoured even
      # though the test tooling cannot run there.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          tools: none

      - name: Syntax-check against the declared PHP floor (7.4)
        working-directory: plugins/naulon
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

  # The suite above is the unit one: decision functions, no WordPress. Everything that only means
  # something against a real database lived in tests/integration and ran nowhere but a laptop, by
  # hand, through wp-env. Two of those tests are load-bearing enough that leaving them there was a
  # standing risk:
  #
  #   UpdaterCacheTest  — a cached update manifest is re-validated against the pinned download host
  #                       on every read. A regression means a poisoned transient names the zip
  #                       WordPress unpacks and executes.
  #   UninstallDataTest — deleting the plugin keeps the publisher's wallets and earnings. A
  #                       regression silently destroys customer data, which is the exact failure
  #                       0.4.0 shipped to end.
  #
  # Real WordPress and a real MySQL, not wp-env: the images wp-env pulls cost more than the whole
  # run, and bin/install-wp-tests.sh gives contributors the same environment locally.
  plugin-integration:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer

      - name: Install dependencies
        working-directory: plugins/naulon
        run: composer install --no-interaction --no-progress

      - name: Install WordPress and the PHPUnit test library
        working-directory: plugins/naulon
        env:
          SKIP_DB_CREATE: "1" # the service container already made it
        run: bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306

      - name: Test (integration — real WordPress, real database)
        working-directory: plugins/naulon
        env:
          WP_TESTS_DIR: /tmp/naulon-wordpress-tests-lib
        run: composer run test:integration
