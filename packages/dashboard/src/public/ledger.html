<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>naulon — the ledger</title>
<meta name="description" content="Live earnings ledger: USDC settled to authors as machines pay to read and cite their work." />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<script src="/theme.js"></script>
<link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="shell-wrap">
    <aside class="shell" id="shell"></aside>
    <main class="main">
      <div class="page-head">
        <div>
          <p class="eyebrow">The ledger</p>
          <h1 class="page-title">Fares paid to cross</h1>
          <p class="page-sub">Every read or citation by a machine settles in USDC on Arc, split across an essay's authors by the credits graph — recursively, down to the coin.</p>
        </div>
      </div>

      <section class="card hero-card">
        <div class="eyebrow">Settled to authors</div>
        <div class="total" id="total" role="status" aria-live="polite" aria-label="0 settled to authors"><span class="cur">$</span>0<span class="frac">.000000</span></div>
        <div class="hero-sub"><b id="nCross">0</b> crossings paid · <b id="nAuthors">0</b> authors earning</div>
      </section>

      <div class="cols">
        <section>
          <div class="section-head"><span class="rule"></span><h2>Authors</h2><span class="n" id="ledgerN">by earnings</span></div>
          <div id="ledger"></div>
        </section>
        <section>
          <div class="section-head"><span class="rule"></span><h2>Recent crossings</h2><span class="n">live</span></div>
          <div class="feed" id="feed" aria-live="polite" aria-relevant="additions"></div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="/ledger.js"></script>
</body>
</html>
