<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>naulon — webhooks</title>
<meta name="description" content="Where this gate reports a settled citation: the endpoints it posts to, whether each delivery landed, and a test ping that travels the real path." />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="shell-wrap">
    <aside class="shell" id="shell"></aside>
    <main class="main">
      <div class="page-head">
        <div>
          <p class="eyebrow">Config</p>
          <h1 class="page-title">Webhooks</h1>
          <p class="page-sub">When a citation settles, the gate can tell your systems about it — signed, retried, and never dropped on the floor. This is where you find out whether it arrived.</p>
        </div>
      </div>

      <div id="notice" aria-live="polite"></div>

      <section class="stat-strip" id="stats"></section>

      <div class="section-head"><span class="rule"></span><h2>Endpoints</h2><span class="n" id="endpointCount"></span></div>
      <div id="endpoints"></div>

      <div class="section-head"><span class="rule"></span><h2>Deliveries</h2><span class="n" id="deliveryCount"></span></div>
      <div id="deliveries"></div>
    </main>
  </div>

  <script type="module" src="/webhooks.js"></script>
</body>
</html>
