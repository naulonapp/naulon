<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>naulon — content</title>
<meta name="description" content="Map your articles to payout wallets — no JSON by hand. Scan your site, fill in wallets, save." />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="shell-wrap">
    <aside class="shell" id="shell"></aside>
    <main class="main">
      <div class="page-head">
        <div>
          <p class="eyebrow">Content</p>
          <h1 class="page-title">Articles and wallets</h1>
          <p class="page-sub">The scanner finds the articles. You map the wallets — that is the one thing no crawler can supply, because only you know who gets paid.</p>
        </div>
      </div>

      <div class="banner" id="banner" aria-live="polite">
        Edits write <span class="mono">credits.json</span> and apply when you <b>restart the gate</b>.
      </div>

      <section class="scan">
        <div class="scan-row">
          <label class="fld"><span>default wallet <span class="dim">(optional — used when a scanned article has no author mapping)</span></span>
            <input id="defaultWallet" class="in" placeholder="0x… 40 hex" spellcheck="false" autocomplete="off" /></label>
          <button id="scanBtn" class="btn">Scan site</button>
        </div>
        <div class="scan-out" id="scanOut"></div>
      </section>

      <section>
        <div class="section-head"><span class="rule"></span><h2>Articles</h2><span class="n" id="count">—</span></div>
        <div class="thead"><span>slug</span><span>author</span><span>payout wallet</span><span></span></div>
        <div id="rows"></div>
        <div class="actions">
          <button id="addBtn" class="btn ghost">+ Add article</button>
          <button id="saveBtn" class="btn btn-primary">Save credits.json</button>
        </div>
        <div class="save-out" id="saveOut" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <script type="module" src="/content.js"></script>
</body>
</html>
